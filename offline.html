  <!-- Self-contained on purpose: this page is shown when nothing else can load. -->
  <style>
    :root { --paper:#F4ECDD; --paper-deep:#EADDC4; --coffee:#2B1A10; --coffee-2:#52402F; --forest:#1F3A2B; --forest-deep:#142419; --turmeric:#E0952A; --turmeric-deep:#A9640F; --kumkum:#A8321F; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--paper);
      color: var(--coffee-2);
      min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.2rem 11rem;
      line-height: 1.7;
      position: relative; overflow-x: hidden;
    }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .13  0 0 0 0 .07  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    .hills { position: fixed; left: 0; right: 0; bottom: 0; line-height: 0; pointer-events: none; }
    .hills svg { display: block; width: 100%; height: clamp(90px, 16vw, 170px); }
    .card { position: relative; text-align: center; max-width: 500px; width: 100%; animation: fadeUp .8s cubic-bezier(.16,.84,.3,1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .signal { width: 112px; height: 112px; margin: 0 auto 1.1rem; color: var(--forest); display: block; }
    .signal path, .signal circle { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .signal .cut { stroke: var(--kumkum); stroke-width: 4; }
    .hand { display: block; font-family: 'Caveat', 'Segoe Print', cursive; font-weight: 600; font-size: 1.6rem; line-height: 1; color: var(--turmeric-deep); transform: rotate(-2deg); margin-bottom: .5rem; }
    h1 { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; letter-spacing: -.03em; color: var(--forest-deep); margin-bottom: 1rem; }
    h1 em { font-style: italic; font-weight: 300; color: var(--turmeric-deep); }
    .lede { font-size: 1.05rem; margin-bottom: 2rem; }
    .contact-card { position: relative; background: #FFFBF3; border: 2px solid var(--coffee); box-shadow: 8px 8px 0 var(--turmeric); padding: 1.7rem 1.5rem 1.3rem; margin-bottom: 2rem; text-align: left; transform: rotate(.7deg); }
    .contact-card::before { content: ''; position: absolute; top: -13px; left: 50%; width: 92px; height: 25px; transform: translateX(-50%) rotate(-3deg); background: rgba(224,149,42,.78); }
    .contact-card__label { font-family: 'Caveat', 'Segoe Print', cursive; font-weight: 600; font-size: 1.6rem; line-height: 1; color: var(--turmeric-deep); margin-bottom: .6rem; }
    .contact-row { display: flex; align-items: flex-start; gap: .85rem; padding: .7rem 0; border-top: 1px dashed #D8C8A8; font-size: .98rem; }
    .contact-row svg { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; color: var(--forest); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .contact-row a { color: var(--forest-deep); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--turmeric); word-break: break-word; }
    .contact-row a:hover { color: var(--turmeric-deep); }
    .btn { display: inline-flex; align-items: center; gap: .6rem; padding: 1rem 1.9rem; font-family: inherit; font-size: .98rem; font-weight: 700; letter-spacing: .02em; color: var(--coffee); background: var(--turmeric); border: 2px solid var(--coffee); border-radius: 3px; box-shadow: 4px 4px 0 var(--coffee); cursor: pointer; transition: transform .18s, box-shadow .18s; min-height: 48px; }
    .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--coffee); }
    .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--coffee); }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 3px solid var(--turmeric); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .btn { transition: none; } }
  </style>
